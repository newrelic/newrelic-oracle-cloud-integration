title: New Relic Configuration for Sending Metrics
name: newrelic-stack-setup
description: This is used to configure the New Relic setup for sending metrics from various OCI services.
schemaVersion: 1.1.0
version: 1.0
locale: "en"
variableGroups:
  - title: "New Relic Environment Configuration"
    variables:
      - ${newrelic_endpoint}
      - ${newrelic_account_id}
      - ${nr_prefix}
      - ${payload_link}
  - title: "Network options"
    variables:
      - ${create_vcn}
      - ${vcnCompartment}
      - ${existingVcn}
      - ${function_subnet_id}
  - title: "Function image"
    variables:
      - ${function_image}
      - ${registry_username}
      - ${registry_auth_token}
  - title: "Hidden"
    visible: false
    variables:
      - ${current_user_ocid}

variables:
  tenancy_ocid:
    type: string
    title: Tenancy OCID
    description: OCI tenant OCID, more details can be found at https://docs.cloud.oracle.com/en-us/iaas/Content/API/Concepts/apisigningkey.htm#five
    required: true
    visible: false

  compartment_ocid:
    type: string
    title: Compartment OCID
    description: The OCID of the compartment where the resources will be created.
    required: true
    visible: false

  region:
    type: string
    title: Region
    description: OCI Region as documented at https://docs.cloud.oracle.com/en-us/iaas/Content/General/Concepts/regions.htm
    required: true
    visible: false

  nr_prefix:
    type: string
    title: New Relic prefix
    description: The prefix to use for New Relic resources for Function and VCNs.
    required: true
    default: metrics

  newrelic_endpoint:
    type: enum
    title: New Relic Endpoint
    description: The endpoint to hit for sending the metrics. Varies by region [US|EU|JP]
    required: true
    allowMultiple: false
    default: US
    enum:
      - US
      - EU
      - JP

  newrelic_account_id:
    type: string
    title: New Relic Account ID
    description: The New Relic Account ID for linking the OCI account to the New Relic account
    required: true
    sensitive: false
    confirmation: true

  create_vcn:
    title: Create VCN
    description: Create virtual network (VCN) for the function setup. If using existing networking resources, de-select "Create VCN" and select the relevant VCN and subnet to use.
    type: boolean
    default: true

  payload_link:
    title: Payload Link
    description: The link to the payload for the connector hubs.
    type: string
    required: true
    visible: true

  vcnCompartment:
    type: oci:identity:compartment:id
    visible:
      not:
        - ${create_vcn}
  existingVcn:
    type: oci:core:vcn:id
    visible:
      not:
        - ${create_vcn}
    dependsOn:
      compartmentId: ${vcnCompartment}
  function_subnet_id:
    title: Function Subnet OCID
    type: oci:core:subnet:id
    visible:
      not:
        - ${create_vcn}
    description: The subnet to be used by the function app that will be deployed. If "Create VCN" is selected, the new VCN will overwrite this selection..
    required: false
    dependsOn:
      compartmentId: ${vcnCompartment}
      vcnId: ${existingVcn}

  function_image:
    type: string
    title: Function image
    description: Public image the metrics function runs. The stack copies it into a private Container Registry repository in this region (newrelic-<prefix>/oci-metrics-forwarder), and the function runs from that copy. Keep the default unless New Relic asks you to change it. Re-applying the stack picks up a new image pushed under the same tag; use a version tag (for example :1.5) to choose when to upgrade.
    required: true
    default: docker.io/newrelic/beyond-oci-metric-function:latest

  registry_username:
    type: string
    title: Container Registry username
    description: Optional. Leave empty to use the user running this stack. Otherwise enter the username of the user that owns the auth token below, without the tenancy namespace. Find it at Profile menu > User settings (or My profile). For a federated user it has the form oracleidentitycloudservice/<username>, and for a user in a non-default identity domain, <identity_domain_name>/<username>.
    required: false

  registry_auth_token:
    type: password
    title: Container Registry auth token
    description: Optional. Leave empty to have the stack create an auth token for the user running it; the stack keeps it for later upgrades and deletes it when the stack is destroyed. Enter a token if that user already has two (the OCI maximum), your organization doesn't allow creating tokens, or pushes should use a dedicated user (then also set Container Registry username). To create one, go to Profile menu > User settings (or My profile) > Tokens and keys > Auth tokens > Generate token, and copy it right away; it is shown only once.
    required: false

  current_user_ocid:
    type: string
    title: Current user OCID
    description: Populated by Resource Manager.
    required: false
    visible: false
