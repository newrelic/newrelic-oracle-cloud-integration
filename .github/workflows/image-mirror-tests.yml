name: Image mirror tests

# Unit tests for the stack's image copier and its signature check (tests/). They need only the
# Python standard library, like the scripts they test.

on:
  pull_request:
    paths:
      - 'newrelic-metrics-setup/*.py'
      - 'tests/**'
      - '.github/workflows/image-mirror-tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Run tests
        run: python3 -m unittest discover -v tests
