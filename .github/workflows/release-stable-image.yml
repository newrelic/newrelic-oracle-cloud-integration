name: Release Stable Image

# Promotes a build of the metrics forwarder image to the `stable` tag on Docker Hub.
#
# Manual only -- workflow_dispatch is the single trigger.
#
# Stable comes only from main: the preflight job rejects a dispatch from any other ref
# before the release job (and its approval gate) is reached.
#
# Approval: the release job runs in the production-environment, so GitHub holds it at
# "Waiting for review" until one of that environment's required reviewers approves. Any
# single reviewer is enough. Required reviewers are configured in repo
# Settings > Environments.
#
# Requires DOCKERHUB_USERNAME and DOCKERHUB_TOKEN in the production-environment secrets.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 1.42. Published as its own tag alongside :stable.'
        required: true
        type: string

permissions:
  contents: read

jobs:
  # Ungated on purpose: a bad ref or a malformed version fails here, before the release
  # job asks a manager or lead to review a run that was never going to publish.
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Require main
        run: |
          if [[ "${{ github.ref }}" != "refs/heads/main" ]]; then
            echo "Error: :stable is cut from main only; this run was dispatched from '${{ github.ref }}'."
            exit 1
          fi

      - name: Validate version input
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "Error: version must look like 1.42 or 1.42.0; got '$VERSION'."
            exit 1
          fi

  build_and_tag_stable:
    runs-on: ubuntu-latest
    needs: preflight
    environment:
      name: production-environment
    env:
      IMAGE: newrelic/beyond-oci-metric-function
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push ${{ env.IMAGE }}:stable
        id: build
        uses: docker/build-push-action@v6
        with:
          # Same context as dockerhub-image.yml, so :stable is built exactly like the
          # routine Docker Hub publish -- only the tags differ.
          context: newrelic-metrics-function
          file: newrelic-metrics-function/Dockerfile
          # OCI Functions GENERIC_X86 shape runs linux/amd64 only.
          platforms: linux/amd64
          # Publish a plain image manifest (no attestation index) so a tag resolves to a
          # single image digest for consumers that read it with one HEAD request.
          provenance: false
          sbom: false
          build-args: FUNCTION_BUILD_VERSION=${{ inputs.version }}
          push: true
          tags: |
            ${{ env.IMAGE }}:stable
            ${{ env.IMAGE }}:${{ inputs.version }}

      - name: Summarize release
        env:
          VERSION: ${{ inputs.version }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### Stable release published"
            echo ""
            echo "- Image: \`$IMAGE\`"
            echo "- Tags: \`stable\`, \`$VERSION\`"
            echo "- Digest: \`$DIGEST\`"
            echo "- Source: \`${{ github.ref_name }}\` @ \`${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
