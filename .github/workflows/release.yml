name: Release

# Publishes the function image to Docker Hub when it changed, then cuts the stack release with that
# image pinned by digest. When the function did not change, the pin carries over from the previous release.
#
# Every pinned image is signed by New Relic's OCI signing service (oci-signer) and its signature is
# verified before the release is cut, so a release never names an image the stack cannot verify.
# Requires, in the production-environment:
#   secrets NR_SYSTEM_IDENTITY_CLIENT_ID, NR_SYSTEM_IDENTITY_PRIVATE_KEY  system identity allowed to sign
#   vars    OCI_SIGNER_CLIENT                                             this repository's oci-signer client
#   vars    FUNCTION_IMAGE_SIGNING_JWKS_URL                               public keys of its signing key

on:
  push:
    branches:
      - main
  workflow_dispatch: # always rebuilds and publishes the image

permissions:
  contents: write

jobs:
  image:
    runs-on: ubuntu-latest
    environment:
      name: production-environment
    env:
      IMAGE: newrelic/beyond-oci-metric-function
    outputs:
      ref: ${{ steps.pin.outputs.ref }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      # Any diff error (manual run, unknown base) counts as a change, so the image gets rebuilt.
      - name: Check whether the function changed
        id: changes
        run: |
          if git diff --quiet "${{ github.event.before }}" "${{ github.sha }}" -- newrelic-metrics-function 2>/dev/null; then
            echo "function=false" >> "$GITHUB_OUTPUT"
          else
            echo "function=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set FUNCTION_BUILD_VERSION
        if: steps.changes.outputs.function == 'true'
        run: echo "FUNCTION_BUILD_VERSION=1.$((1 + ${{ github.run_number }}))" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        if: steps.changes.outputs.function == 'true'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to Docker Hub
        if: steps.changes.outputs.function == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push ${{ env.IMAGE }}
        if: steps.changes.outputs.function == 'true'
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: newrelic-metrics-function
          file: newrelic-metrics-function/Dockerfile
          # OCI Functions GENERIC_X86 shape runs linux/amd64 only.
          platforms: linux/amd64
          # Single image manifest, so outputs.digest is the digest the stack resolves.
          provenance: false
          sbom: false
          build-args: FUNCTION_BUILD_VERSION=${{ env.FUNCTION_BUILD_VERSION }}
          push: true
          # Only the version tag: latest moves once the image is signed, so it never points at an
          # image that fails verification.
          tags: ${{ env.IMAGE }}:${{ env.FUNCTION_BUILD_VERSION }}

      # The digest comes from this build's output, or from the previous release; never from a Docker Hub tag lookup.
      - name: Pin function image
        id: pin
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          if [ -n "$DIGEST" ]; then
            ref="docker.io/${IMAGE}:${FUNCTION_BUILD_VERSION}@${DIGEST}"
          else
            ref=$(gh release download --repo "$GITHUB_REPOSITORY" --pattern function_image.lock --output -)
          fi
          echo "Pinned function image: $ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # v2 reads the sha256-<digest>.sig signatures oci-signer writes.
          cosign-release: v2.6.5

      # A fresh build is always signed. A carried-over pin is signed only if it has no valid
      # signature yet (an image published before signing existed); it came from this repository's
      # own release asset, the same trust root the pin already relies on.
      - name: Sign function image
        env:
          REF: ${{ steps.pin.outputs.ref }}
          BUILT: ${{ steps.build.outputs.digest != '' }}
          SIGNING_JWKS_URL: ${{ vars.FUNCTION_IMAGE_SIGNING_JWKS_URL }}
          OCI_SIGNER_CLIENT: ${{ vars.OCI_SIGNER_CLIENT }}
          NR_CLIENT_ID: ${{ secrets.NR_SYSTEM_IDENTITY_CLIENT_ID }}
          NR_PRIVATE_KEY_B64: ${{ secrets.NR_SYSTEM_IDENTITY_PRIVATE_KEY }}
        run: |
          if [ "$BUILT" = "true" ] || ! script/verify_function_image.sh "$REF"; then
            script/sign_function_image.sh "$REF"
          fi

      - name: Verify function image signature
        env:
          REF: ${{ steps.pin.outputs.ref }}
          SIGNING_JWKS_URL: ${{ vars.FUNCTION_IMAGE_SIGNING_JWKS_URL }}
        run: script/verify_function_image.sh "$REF"

      # The same check the stack runs before deploying, against the key URL the stack uses:
      # catches a wrong URL or a signature format the stack's verifier does not accept.
      - name: Verify with the stack's own verifier
        env:
          REF: ${{ steps.pin.outputs.ref }}
        run: |
          jq -n --arg ref "$REF" '{source_image: $ref, platform: "linux/amd64"}' \
            | python3 newrelic-metrics-setup/image_mirror.py resolve

      # Same carbon copy as release-stable-image.yml: --prefer-index=false keeps latest on the
      # version tag's digest instead of wrapping it in a new index.
      - name: Point latest at the signed image
        if: steps.changes.outputs.function == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker buildx imagetools create --prefer-index=false --tag "$IMAGE:latest" "$IMAGE@$DIGEST"
          actual=$(docker buildx imagetools inspect "$IMAGE:latest" --format '{{.Manifest.Digest}}')
          if [[ "$actual" != "$DIGEST" ]]; then
            echo "Error: $IMAGE:latest resolved to $actual, expected $DIGEST."
            exit 1
          fi

  release:
    needs: image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zip git gh

      - name: Execute release script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FUNCTION_IMAGE: ${{ needs.image.outputs.ref }}
        run: bash script/release_plan.sh
